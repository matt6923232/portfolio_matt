<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Special Video 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    font-family: 'Poppins', sans-serif;
    color: #fff;
    overflow: hidden;
    background: radial-gradient(circle at top, #ffe6eb, #ff9fb3);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
  }

  /* Floating hearts */
  .heart {
    position: fixed;
    bottom: -20px;
    font-size: 18px;
    animation: rise 7s linear infinite;
    opacity: 0.6;
    pointer-events: none;
  }

  @keyframes rise {
    0% { transform: translateY(0) scale(0.7); opacity: 0; }
    20% { opacity: 0.6; }
    100% { transform: translateY(-120vh) scale(1.4); opacity: 0; }
  }

  /* Frame for video */
  .frame {
    background: #111;
    border: 4px solid #ff5a5a;
    border-radius: 20px;
    box-shadow: 0 15px 50px rgba(255,90,90,0.5);
    width: 90vw;         /* <-- responsive width */
    max-width: 600px;    /* optional maximum */
    height: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .frame video {
    width: 100%;       /* fills container */
    height: auto;
    max-height: 80vh;  /* never taller than screen */
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(255,90,90,0.4);
    object-fit: contain;
  }

  .ily {
    font-size: 1.8rem;
    color: #ff5a5a;
    text-shadow: 2px 2px 8px rgba(255,90,90,0.7);
    font-weight: 600;
    margin: 20px 0 10px 0;
    max-width: 90vw;
  }

  .back-btn {
    padding: 12px 30px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 30px;
    border: none;
    background: linear-gradient(135deg, #ff5c7c, #ff1f4b);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(255,0,80,0.35);
    transition: transform 0.2s, box-shadow 0.2s;
    margin-bottom: 20px;
  }

  .back-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 15px 35px rgba(255,0,80,0.45);
  }

  @media (max-width: 420px) {
    .ily { font-size: 1.5rem; }
    .frame { width: 95vw; }
  }
</style>
</head>
<body>

<script>
  const hearts = ["💖","💗","💘","❤️","💞"];
  setInterval(() => {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerText = hearts[Math.floor(Math.random()*hearts.length)];
    h.style.left = Math.random() * 100 + "vw";
    h.style.animationDuration = (6 + Math.random()*4) + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 10000);
  }, 500);
</script>

<div class="frame">
  <video src="vid.mp4" controls></video>
</div>

<div class="ily">I LOVE YOU</div>
<button class="back-btn" onclick="location.href='yes.html'">← Back</button>

</body>
</html>
