<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flower Icon Design</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top, #ffe6eb, #ff9fb3);
  color: #5a1b1b;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  text-align: center;
  overflow-x: hidden;
  position: relative;
}

/* Floating hearts */
.heart {
  position: fixed;
  bottom: -20px;
  font-size: 18px;
  animation: rise 7s linear infinite;
  opacity: 0.6;
  pointer-events: none;
  user-select: none;
  z-index: 1000;
}
@keyframes rise {
  0% { transform: translateY(0) scale(0.7); opacity: 0; }
  20% { opacity: 0.6; }
  100% { transform: translateY(-120vh) scale(1.4); opacity: 0; }
}

/* Container for flower and messages */
.container {
  position: relative;
  width: 100%;
  max-width: 680px;
  background: #fff5f7;
  border: 3px solid #ff6f91;
  border-radius: 24px;
  box-shadow: 0 10px 25px rgba(255, 0, 80, 0.3);
  padding: 40px 40px; /* flexible padding */
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 20px;
  overflow: visible;
}

/* Flower image */
.flower-img {
  width: 100%;
  max-width: 300px;
  border-radius: 20px;
  filter: drop-shadow(0 4px 4px rgba(255, 0, 80, 0.2));
  object-fit: contain;
  z-index: 10;
}

/* Messages */
.messages-left,
.messages-right {
  position: absolute;
  top: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  max-height: 500px;
  width: 120px;
  pointer-events: none;
}

.messages-left { left: -140px; align-items: flex-start; }
.messages-right { right: -140px; align-items: flex-end; }

.bubble {
  background: #ffe1ea;
  border: 2px solid #ff6f91;
  border-radius: 30px;
  padding: 12px 18px;
  font-size: 0.9rem;
  line-height: 1.3;
  box-shadow: 2px 2px 6px rgba(255, 111, 145, 0.3);
  max-width: 130px;
  position: relative;
  pointer-events: auto;
  user-select: none;
  cursor: default;
  margin: 8px 0;
  color: #7a2f41;
}

.messages-left .bubble::after {
  content: "";
  position: absolute;
  width: 20px;
  height: 20px;
  background: #ffe1ea;
  border-left: 2px solid #ff6f91;
  border-bottom: 2px solid #ff6f91;
  border-radius: 4px;
  transform: rotate(-45deg);
  top: 18px;
  right: -12px;
}

.messages-right .bubble::after {
  content: "";
  position: absolute;
  width: 20px;
  height: 20px;
  background: #ffe1ea;
  border-right: 2px solid #ff6f91;
  border-bottom: 2px solid #ff6f91;
  border-radius: 4px;
  transform: rotate(45deg);
  top: 18px;
  left: -12px;
}

.back-btn {
  padding: 8px 18px;
  border-radius: 30px;
  border: none;
  background: linear-gradient(135deg, #ff5c7c, #ff1f4b);
  color: #fff;
  font-size: 0.8rem;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(255, 0, 80, 0.45);
  margin-top: 20px;
  width: 90%;
  max-width: 320px;
  transition: transform 0.2s, box-shadow 0.2s;
}

.back-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 12px 30px rgba(255, 0, 80, 0.6);
}

/* Responsive adjustments for small screens */
@media (max-width: 700px) {
  .container {
    flex-direction: column;
    padding: 20px 20px;
  }
  .flower-img { max-width: 90%; }
  .messages-left, .messages-right {
    position: static;
    flex-direction: row;
    justify-content: center;
    width: 100%;
    margin-top: 15px;
  }
  .messages-left .bubble, .messages-right .bubble {
    margin: 5px 5px;
    max-width: 120px;
  }
  .messages-left .bubble::after, .messages-right .bubble::after {
    display: none;
  }
}

@media (max-width: 400px) {
  body { padding: 10px; }
  .flower-img { max-width: 100%; border-radius: 15px; }
  .bubble { font-size: 0.8rem; }
}
</style>
</head>
<body>

<div class="container">
  <img src="last.jpg" alt="Flower Picture" class="flower-img">

  <div class="messages-left">
    <div class="bubble">I LOVE UR SMILEEE</div>
    <div class="bubble">super pretty mo</div>
    <div class="bubble">i love ur humor</div>
      <div class="bubble">im ur no.1 supporter</div>
  </div>

  <div class="messages-right">
    <div class="bubble">i admire u a lot</div>
    <div class="bubble">u make me the happiest:))</div>
    <div class="bubble">i feel so at ease</div>
    <div class="bubble">u are special to me</div>
  </div>
</div>

<button class="back-btn" onclick="location.href='yes.html'">← Back</button>

<script>
const hearts = ["💖","💗","💘","❤️","💞"];
setInterval(() => {
  const h = document.createElement("div");
  h.className = "heart";
  h.innerText = hearts[Math.floor(Math.random()*hearts.length)];
  h.style.left = Math.random() * 100 + "vw";
  h.style.animationDuration = (6 + Math.random()*4) + "s";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 10000);
}, 500);
</script>

</body>
</html>
